[project]
name = "arny"
version = "0.1.0"
description = "Life & Activity MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
]

[project.scripts]
arny = "arny.cli:main"
arny-mcp = "arny.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
